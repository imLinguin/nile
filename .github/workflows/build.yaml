name: Build binaries
on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version-file: 'pyproject.toml'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true 

    - name: Install pyinstaller and dependencies
      run: uv sync --extra pyinstaller_build --no-install-local

    - name: Optional dependencies (WebView)
      run: uv sync --extra webview --no-install-local --inexact
      if: runner.os != 'macOS'

    - name: Set strip on Linux and Mac
      id: strip
      run: echo "option=--strip" >> $GITHUB_OUTPUT
      if: runner.os != 'Windows'

    - name: Build
      run: uv run --module PyInstaller
        --onefile
        --name nile 
        ${{ steps.strip.outputs.option }}
        nile/cli.py
      env:
        PYTHONOPTIMIZE: 1

    - uses: actions/upload-artifact@v7
      with:
        name: nile-${{ matrix.os }}
        path: dist/*
